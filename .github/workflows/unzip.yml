name: Unzip site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP and commit
        run: |
          unzip -o spacemanager-landing.zip
          git rm -q spacemanager-landing.zip .github/workflows/unzip.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unpack landing page files"
          git push
